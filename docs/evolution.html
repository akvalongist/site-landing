<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complex Microbe Evolution</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #001;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="ui"></div>
  <script>
    const CONFIG = {
      width: 1200,
      height: 800,
      initialMicrobes: 20,
      initialFood: 80,
      initialToxin: 10,
      foodPerStep: 2,
      toxinPerStep: 0.02
    };

    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    canvas.width = CONFIG.width;
    canvas.height = CONFIG.height;
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Vector2 {
      constructor(x=0, y=0){ this.x=x; this.y=y; }
      add(v){ this.x+=v.x; this.y+=v.y; return this; }
      sub(v){ this.x-=v.x; this.y-=v.y; return this; }
      mul(s){ this.x*=s; this.y*=s; return this; }
      len(){ return Math.hypot(this.x,this.y); }
      norm(){ const l=this.len(); if(l>0){ this.x/=l; this.y/=l; } return this; }
      clone(){ return new Vector2(this.x,this.y); }
    }

    class Food {
      constructor(x,y){ this.pos=new Vector2(x,y); this.energy=10; }
      draw(){ ctx.fillStyle='#6f6'; ctx.beginPath(); ctx.arc(this.pos.x,this.pos.y,3,0,Math.PI*2); ctx.fill(); }
    }

    class Toxin {
      constructor(x,y){ this.pos=new Vector2(x,y); }
      draw(){ ctx.fillStyle='#f66'; ctx.beginPath(); ctx.rect(this.pos.x-2,this.pos.y-2,4,4); ctx.fill(); }
    }

    class Microbe {
      constructor(x,y){
        this.pos = new Vector2(x,y);
        this.vel = new Vector2(Math.random()*2-1, Math.random()*2-1);
        this.size = 5;
        this.energy = 20;
        this.maxEnergy = 40;
        this.speed = 1.5;
        this.color = `hsl(${Math.random()*360},70%,60%)`;
        this.genes = [];
        this.age = 0;
      }
      step(){
        this.pos.add(this.vel.clone().mul(this.speed));
        if(this.pos.x<0 || this.pos.x>canvas.width) this.vel.x*=-1;
        if(this.pos.y<0 || this.pos.y>canvas.height) this.vel.y*=-1;
        this.energy -= 0.03;
        this.age++;
        applyGenes(this);
        if(this.energy > this.maxEnergy){
          this.energy *= 0.5;
          const child = new Microbe(this.pos.x+Math.random()*10-5,this.pos.y+Math.random()*10-5);
          child.genes = mutateGenes(this.genes);
          microbes.push(child);
        }
      }
      draw(){
        ctx.fillStyle=this.color;
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI*2);
        ctx.fill();
      }
    }

    class PlayerMicrobe extends Microbe {
      constructor(x,y){
        super(x,y);
        this.color = '#ff0';
      }
      step(){
        if(keys['KeyW'] || keys['ArrowUp']) this.vel.y -= 0.1;
        if(keys['KeyS'] || keys['ArrowDown']) this.vel.y += 0.1;
        if(keys['KeyA'] || keys['ArrowLeft']) this.vel.x -= 0.1;
        if(keys['KeyD'] || keys['ArrowRight']) this.vel.x += 0.1;
        super.step();
      }
    }

    function mutateGenes(genes){
      const mutated = genes.slice();
      if(Math.random()<0.1 && mutated.length < GENE_FUNCS.length){
        mutated.push(GENE_FUNCS[Math.floor(Math.random()*GENE_FUNCS.length)]);
      }
      if(mutated.length>0 && Math.random()<0.05) mutated.splice(Math.floor(Math.random()*mutated.length),1);
      return mutated;
    }

    function applyGenes(m){
      for(const g of m.genes){ g(m); }
    }

    const microbes = [];
    const foods = [];
    const toxins = [];
    let player = null;

    function spawnFood(){
      foods.push(new Food(Math.random()*canvas.width, Math.random()*canvas.height));
    }
    function spawnToxin(){
      toxins.push(new Toxin(Math.random()*canvas.width, Math.random()*canvas.height));
    }

    function init(){
      microbes.length=0; foods.length=0; toxins.length=0;
      for(let i=0;i<CONFIG.initialMicrobes;i++) microbes.push(new Microbe(Math.random()*canvas.width, Math.random()*canvas.height));
      player = new PlayerMicrobe(canvas.width/2, canvas.height/2);
      microbes.push(player);
      for(let i=0;i<CONFIG.initialFood;i++) spawnFood();
      for(let i=0;i<CONFIG.initialToxin;i++) spawnToxin();
    }

    function update(){
      if(Math.random()<CONFIG.foodPerStep) spawnFood();
      if(Math.random()<CONFIG.toxinPerStep) spawnToxin();
      for(const m of microbes){ m.step(); }
      for(const m of microbes){
        for(const f of foods){
          const d = Math.hypot(m.pos.x - f.pos.x, m.pos.y - f.pos.y);
          if(d < m.size + 3){ m.energy += f.energy; foods.splice(foods.indexOf(f),1); break; }
        }
        for(const t of toxins){
          const d = Math.hypot(m.pos.x - t.pos.x, m.pos.y - t.pos.y);
          if(d < m.size + 3){ m.energy -= 5; toxins.splice(toxins.indexOf(t),1); break; }
        }
      }
      for(let i=microbes.length-1;i>=0;i--){ if(microbes[i].energy <= 0) microbes.splice(i,1); }
    }

    function draw(){
      ctx.fillStyle='#001';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(const f of foods) f.draw();
      for(const t of toxins) t.draw();
      for(const m of microbes) m.draw();
      ui.textContent = `Микробы: ${microbes.length} | Еда: ${foods.length} | Токсины: ${toxins.length} | Энергия игрока: ${player.energy.toFixed(1)}`;
    }

    function loop(){
      update();
      draw();
      requestAnimationFrame(loop);
    }

    init();
    loop();
